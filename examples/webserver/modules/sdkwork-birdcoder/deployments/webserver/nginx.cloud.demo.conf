# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/birdcoder/webserver.pid;
error_log /var/log/sdkwork/birdcoder/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name code-demo.sdkwork.com code-demo.birdcoder.com code-demo.dtupay.com code-demo.sdkwork.cn code-demo.birdcoder.cn code-demo.dtupay.cn code-demo.skubc.com code-demo.skubc.cn code-demo.zowalk.com code-demo.zowalk.cn code-demo.offer86.com code-demo.offer86.cn code-demo.86offer.com code-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}

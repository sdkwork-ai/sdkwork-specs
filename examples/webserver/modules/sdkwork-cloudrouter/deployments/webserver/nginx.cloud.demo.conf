# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/router/webserver.pid;
error_log /var/log/sdkwork/router/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name router-demo.sdkwork.com router-demo.birdcoder.com router-demo.dtupay.com router-demo.sdkwork.cn router-demo.birdcoder.cn router-demo.dtupay.cn router-demo.skubc.com router-demo.skubc.cn router-demo.zowalk.com router-demo.zowalk.cn router-demo.offer86.com router-demo.offer86.cn router-demo.86offer.com router-demo.86offer.cn cloudrouter-demo.sdkwork.com router-admin-demo.sdkwork.com router-admin-demo.birdcoder.com router-admin-demo.dtupay.com router-admin-demo.sdkwork.cn router-admin-demo.birdcoder.cn router-admin-demo.dtupay.cn router-admin-demo.skubc.com router-admin-demo.skubc.cn router-admin-demo.zowalk.com router-admin-demo.zowalk.cn router-admin-demo.offer86.com router-admin-demo.offer86.cn router-admin-demo.86offer.com router-admin-demo.86offer.cn router-open-demo.sdkwork.com router-open-demo.birdcoder.com router-open-demo.dtupay.com router-open-demo.sdkwork.cn router-open-demo.birdcoder.cn router-open-demo.dtupay.cn router-open-demo.skubc.com router-open-demo.skubc.cn router-open-demo.zowalk.com router-open-demo.zowalk.cn router-open-demo.offer86.com router-open-demo.offer86.cn router-open-demo.86offer.com router-open-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}

# Multi-base-domain binding example (APP_RUNTIME_TOPOLOGY_NAMING.md section 9):
# one site, many hosts — the primary registered host is `domain`, additional
# registered hosts of the same profile environment are `aliases` and share the
# site file, certificate, and upstream (NGINX_SPEC.md section 1).
#
# Certificate note: aliases span multiple base domains (sdkwork.com +
# birdcoder.com + dtupay.com); `tls: sdkwork.com` requires the certificate to
# cover every bound host — use a SAN certificate or one wildcard/SAN per base
# domain (NGINX_SPEC.md section 3).
version: 2
defaultProfile: cloud.production

profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: router-test.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - router-test.birdcoder.com router-test.noaper.com
          - router-test.dtupay.com router-test.noaper.com
    packages: []
    overrides: {}

  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: router.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - router.birdcoder.com router.noaper.com
          - router.dtupay.com router.noaper.com
    packages: []
    overrides: {}

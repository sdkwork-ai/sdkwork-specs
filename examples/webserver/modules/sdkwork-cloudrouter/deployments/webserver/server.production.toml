environment = "production"

[http]

[http.certificates]

[http.certificates."sdkwork.com"]
certFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.com/chain.pem"
ocspStapling = true

[http.certificates."birdcoder.com"]
certFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.com/chain.pem"
ocspStapling = true

[http.certificates."dtupay.com"]
certFile = "/etc/sdkwork/certs/letsencrypt/dtupay.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/dtupay.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/dtupay.com/chain.pem"
ocspStapling = true

[[http.server]]
listen = ["443 ssl", "80"]
serverName = ["router.sdkwork.com", "cloudrouter.sdkwork.com"]

[http.server.tls]
cert = "sdkwork.com"
protocols = ["TLSv1.2", "TLSv1.3"]
preferServerCiphers = true
sessionCache = "shared:SSL:10m"

[[http.server.location]]
match = "= /healthz"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host"]

[[http.server.location]]
match = "= /readyz"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host"]

[[http.server.location]]
match = "/api/"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]

[[http.server.location]]
match = "/"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host", "X-Real-IP $remote_addr", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyBuffering = false
proxyReadTimeout = "120s"
proxySendTimeout = "120s"


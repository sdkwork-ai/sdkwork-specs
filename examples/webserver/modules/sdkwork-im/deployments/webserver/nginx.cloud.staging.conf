# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/im/webserver.pid;
error_log /var/log/sdkwork/im/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name im-staging.sdkwork.com im-staging.birdcoder.com im-staging.dtupay.com im-staging.sdkwork.cn im-staging.birdcoder.cn im-staging.dtupay.cn im-staging.skubc.com im-staging.skubc.cn im-staging.zowalk.com im-staging.zowalk.cn im-staging.offer86.com im-staging.offer86.cn im-staging.86offer.com im-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}

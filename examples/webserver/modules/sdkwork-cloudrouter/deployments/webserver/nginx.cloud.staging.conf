# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/router/webserver.pid;
error_log /var/log/sdkwork/router/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name router-staging.sdkwork.com router-staging.birdcoder.com router-staging.dtupay.com router-staging.sdkwork.cn router-staging.birdcoder.cn router-staging.dtupay.cn router-staging.skubc.com router-staging.skubc.cn router-staging.zowalk.com router-staging.zowalk.cn router-staging.offer86.com router-staging.offer86.cn router-staging.86offer.com router-staging.86offer.cn cloudrouter-staging.sdkwork.com router-admin-staging.sdkwork.com router-admin-staging.birdcoder.com router-admin-staging.dtupay.com router-admin-staging.sdkwork.cn router-admin-staging.birdcoder.cn router-admin-staging.dtupay.cn router-admin-staging.skubc.com router-admin-staging.skubc.cn router-admin-staging.zowalk.com router-admin-staging.zowalk.cn router-admin-staging.offer86.com router-admin-staging.offer86.cn router-admin-staging.86offer.com router-admin-staging.86offer.cn router-open-staging.sdkwork.com router-open-staging.birdcoder.com router-open-staging.dtupay.com router-open-staging.sdkwork.cn router-open-staging.birdcoder.cn router-open-staging.dtupay.cn router-open-staging.skubc.com router-open-staging.skubc.cn router-open-staging.zowalk.com router-open-staging.zowalk.cn router-open-staging.offer86.com router-open-staging.offer86.cn router-open-staging.86offer.com router-open-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}

# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/im/webserver.pid;
error_log /var/log/sdkwork/im/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18079;
    }
    server {
        listen 80;
        server_name im-demo.sdkwork.com im-demo.birdcoder.com im-demo.dtupay.com im-demo.sdkwork.cn im-demo.birdcoder.cn im-demo.dtupay.cn im-demo.skubc.com im-demo.skubc.cn im-demo.zowalk.com im-demo.zowalk.cn im-demo.offer86.com im-demo.offer86.cn im-demo.86offer.com im-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}

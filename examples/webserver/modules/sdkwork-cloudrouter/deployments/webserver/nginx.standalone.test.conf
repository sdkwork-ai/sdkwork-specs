# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/router/webserver.pid;
error_log /var/log/sdkwork/router/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 0.0.0.0:3900;
    }
    server {
        listen 80;
        server_name router-test.sdkwork.com router-test.birdcoder.com router-test.dtupay.com router-test.sdkwork.cn router-test.birdcoder.cn router-test.dtupay.cn router-test.skubc.com router-test.skubc.cn router-test.zowalk.com router-test.zowalk.cn router-test.offer86.com router-test.offer86.cn router-test.86offer.com router-test.86offer.cn cloudrouter-test.sdkwork.com router-admin-test.sdkwork.com router-admin-test.birdcoder.com router-admin-test.dtupay.com router-admin-test.sdkwork.cn router-admin-test.birdcoder.cn router-admin-test.dtupay.cn router-admin-test.skubc.com router-admin-test.skubc.cn router-admin-test.zowalk.com router-admin-test.zowalk.cn router-admin-test.offer86.com router-admin-test.offer86.cn router-admin-test.86offer.com router-admin-test.86offer.cn router-open-test.sdkwork.com router-open-test.birdcoder.com router-open-test.dtupay.com router-open-test.sdkwork.cn router-open-test.birdcoder.cn router-open-test.dtupay.cn router-open-test.skubc.com router-open-test.skubc.cn router-open-test.zowalk.com router-open-test.zowalk.cn router-open-test.offer86.com router-open-test.offer86.cn router-open-test.86offer.com router-open-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}

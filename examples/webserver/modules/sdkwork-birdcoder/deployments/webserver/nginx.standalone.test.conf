# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/birdcoder/webserver.pid;
error_log /var/log/sdkwork/birdcoder/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:10240;
    }
    server {
        listen 80;
        server_name code-test.sdkwork.com code-test.birdcoder.com code-test.dtupay.com code-test.sdkwork.cn code-test.birdcoder.cn code-test.dtupay.cn code-test.skubc.com code-test.skubc.cn code-test.zowalk.com code-test.zowalk.cn code-test.offer86.com code-test.offer86.cn code-test.86offer.com code-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
